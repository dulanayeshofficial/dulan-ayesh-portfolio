<!DOCTYPE html>

<head>

<style>
  :root{
    --ink-900:#014D46; --ink-700:#027368; --ink-100:#E1F2F0;
    --ink:#1D1D1F; --slate:#6E6E73; --white:#FFFFFF;
    --serif:'Fraunces',serif; --sans:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--sans); color:var(--ink); background:var(--white); line-height:1.5;
    -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column;}
  a{color:inherit; text-decoration:none;}
  :focus-visible{outline:2px solid var(--ink-700); outline-offset:3px;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 28px; width:100%;}
  .skiplink{position:absolute; left:-9999px; top:0; z-index:100; background:var(--ink); color:var(--white); padding:12px 20px; border-radius:0 0 10px 0; font-size:14px; font-weight:600;}
  .skiplink:focus{left:0;}
  header{border-bottom:1px solid rgba(0,0,0,0.06);}
  nav{display:flex; align-items:center; padding:16px 28px; max-width:1120px; margin:0 auto;}
  .brand{font-family:var(--serif); font-weight:500; font-size:18px;}
  main{flex:1; display:flex; align-items:center; padding:80px 0 100px;
    background:radial-gradient(ellipse 60% 50% at 82% 12%, var(--ink-100) 0%, transparent 60%);}
  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-700);}
  h1{font-family:var(--serif); font-weight:400; font-size:clamp(32px,4.6vw,46px); line-height:1.15; margin:16px 0 18px; max-width:600px;}
  .lede{font-size:17px; color:var(--slate); max-width:520px; line-height:1.65; margin-bottom:34px;}
  .go{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:42px;}
  .btn-primary{font-size:15px; font-weight:600; padding:14px 26px; min-height:48px; background:var(--ink-700); color:var(--white); border-radius:100px; display:inline-flex; align-items:center;}
  .btn-primary:hover{background:var(--ink-900);}
  .btn-ghost{font-size:15px; font-weight:600; padding:14px 26px; min-height:48px; border:1.5px solid rgba(0,0,0,0.14); border-radius:100px; display:inline-flex; align-items:center;}
  .btn-ghost:hover{border-color:var(--ink-700); background:var(--ink-100);}
  .elsewhere{border-top:1px solid rgba(0,0,0,0.08); padding-top:24px; max-width:620px;}
  .elsewhere .eyebrow{display:block; margin-bottom:12px;}
  .links{display:flex; flex-wrap:wrap; gap:8px 24px;}
  .links a{font-size:15px; font-weight:500; color:var(--ink-700); min-height:44px; display:inline-flex; align-items:center;}
  .links a:hover{text-decoration:underline;}
  footer{background:var(--ink); color:rgba(255,255,255,0.6); padding:26px 0; font-size:14px;}
  .foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  .foot a{word-break:break-word;}
  @media (max-width:640px){ main{padding:52px 0 64px;} }
</style>
</head>
<body>
<a class="skiplink" href="#main">Skip to content</a>
<header><nav><a href="/" class="brand">Dulan Ayesh</a></nav></header>

<main id="main">
  <div class="wrap">
    <span class="eyebrow">Error 404</span>
    <h1>That page isn't here.</h1>
    <p class="lede">The link may be out of date, or the address might have a typo. Nothing's broken on your end.</p>
    <div class="go">
      <a href="/" class="btn-primary">Back to home</a>
      <a href="/#contact" class="btn-ghost">Get in touch</a>
    </div>
    <div class="elsewhere">
      <span class="eyebrow">Try one of these</span>
      <div class="links">
        <a href="/#experience">Experience</a>
        <a href="/#case-study">Case study</a>
        <a href="/#builds">Builds</a>
        <a href="/#writing">Writing</a>
        <a href="/#results">Results</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <span>&copy; 2026 Dulan Ayesh</span>
    <a href="mailto:dulanayesh2@gmail.com">dulanayesh2@gmail.com</a>
  </div>
</footer>
</body>
</html>
